# .github/workflows/lfs-size-badge.yml
name: Update LFS size badge
on:
  push:
    branches: [main]
jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Compute LFS size
        run: |
          SIZE=$(git lfs ls-files -s | awk '{sum+=$1} END {print sum}')
          HUMAN=$(numfmt --to=iec-i --suffix=B $SIZE)
          mkdir -p .github/badges
          echo "{\"schemaVersion\":1,\"label\":\"repo size\",\"message\":\"$HUMAN\",\"color\":\"orange\"}" > .github/badges/lfs-size.json
      - name: Commit badge data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .github/badges/lfs-size.json
          git commit -m "Update LFS size badge" || echo "No changes"
          git push
