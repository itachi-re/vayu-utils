# .github/workflows/lfs-size-badge.yml
name: Update LFS size badge

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/badges/**'   # avoid retriggering itself when the badge commit lands
  workflow_dispatch: {}

concurrency:
  group: lfs-size-badge
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Compute LFS size
        id: size
        run: |
          set -euo pipefail

          if ! git lfs ls-files -n >/tmp/lfs-files.txt 2>/dev/null; then
            echo "SIZE=0" >> "$GITHUB_ENV"
            exit 0
          fi

          SIZE=0
          if [ -s /tmp/lfs-files.txt ]; then
            while IFS= read -r f; do
              [ -f "$f" ] && SIZE=$(( SIZE + $(stat -c%s -- "$f") ))
            done < /tmp/lfs-files.txt
          fi
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Build badge JSON
        run: |
          set -euo pipefail
          HUMAN=$(numfmt --to=iec-i --suffix=B "$SIZE")

          # simple size-based color tiers
          if   [ "$SIZE" -lt 104857600 ];   then COLOR=brightgreen   # <100 MiB
          elif [ "$SIZE" -lt 1073741824 ];  then COLOR=green         # <1 GiB
          elif [ "$SIZE" -lt 5368709120 ];  then COLOR=yellow        # <5 GiB
          else                                    COLOR=red
          fi

          mkdir -p .github/badges
          cat > .github/badges/lfs-size.json <<EOF
          {"schemaVersion":1,"label":"lfs size","message":"$HUMAN","color":"$COLOR"}
          EOF

      - name: Commit badge data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/lfs-size.json
          if git diff --cached --quiet; then
            echo "No changes to badge"
          else
            git commit -m "Update LFS size badge [skip ci]"
            git push
          fi
